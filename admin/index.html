<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Pick'em · esportsku</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D5BFF;--blue-600:#0F47E0;--blue-100:#EAF0FF;--ink:#0A1226;--text2:#3A4459;--muted:#5B6479;--canvas:#F6F8FC;--border:#E3E8F0;
  --ok:#0B7F45;--ok-bg:#E6F6EE;--warn:#B45309;--warn-bg:#FFF4E0;--bad:#D02F33;--bad-bg:#FDECEC;
  --card-sh:inset 0 1px 0 #fff,0 1px 2px rgba(10,18,38,.05),0 18px 40px -18px rgba(16,40,110,.22)}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--canvas);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}
header h1{font-size:18px;font-weight:800}
header small{color:var(--muted);font-weight:600}
h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.card{background:linear-gradient(180deg,#fff,#FBFCFE);box-shadow:var(--card-sh);border-radius:16px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi .n{font-size:26px;font-weight:800}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.matches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.m-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.m-head b{color:var(--ink)}
.teams{font-weight:800;font-size:15px;margin:6px 0 12px}
label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin:10px 0 4px}
input[type=datetime-local],select,textarea,input[type=url]{width:100%;min-height:42px;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:72px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:10px;font-size:13px}
.check input{width:18px;height:18px}
.btn{min-height:42px;padding:0 16px;border-radius:10px;font-weight:700}
.btn.primary{background:linear-gradient(160deg,#4D7DFF,#1D5BFF 55%,#0F47E0);color:#fff;width:100%;margin-top:14px}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border:1.5px solid var(--border);background:#fff}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--blue-100);color:var(--blue-600)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.void{background:var(--bad-bg);color:var(--bad)}
.pill.off{background:var(--border);color:var(--muted)}
.msg{margin-top:8px;font-size:12px;font-weight:700}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.log{font-size:12px;color:var(--text2)}
.log b{color:var(--ink)}
.center{max-width:420px;margin:12vh auto;text-align:center}
.center p{color:var(--text2);margin:8px 0 18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Admin Pick'em MPL ID S18</h1><small id="who"></small></div>
    <div><a class="btn ghost" href="../" style="display:inline-flex;align-items:center;text-decoration:none">Lihat tool</a> <button class="btn ghost" id="logout" hidden>Keluar</button></div>
  </header>

  <div id="gate" class="card center">
    <h1 style="font-size:20px">Masuk admin</h1>
    <p id="gate-msg">Pakai akun Google yang terdaftar sebagai admin.</p>
    <button class="btn primary" id="login">Masuk dengan Google</button>
  </div>

  <main id="app" hidden>
    <h2>Metrik tes</h2>
    <div class="grid" id="kpi"></div>

    <h2>Hasil & jadwal match</h2>
    <p style="color:var(--text2);margin:-4px 0 12px">Isi skor maksimal 30 menit setelah match selesai. Poin, klasemen (≤ 1 menit), dan tim babak berikut terisi otomatis. Jam dalam WIB.</p>
    <div class="matches" id="matches"></div>

    <h2>Pengumuman</h2>
    <div class="card">
      <label for="a-body">Isi (maks 280 huruf) — tampil di atas tool untuk semua pemain</label>
      <textarea id="a-body" maxlength="280" placeholder="Contoh: M3 diundur ke 19.00 WIB. Tebakan dibuka sampai jam baru."></textarea>
      <label for="a-link">Link (opsional, https://)</label>
      <input type="url" id="a-link" placeholder="https://esportsku.com/...">
      <button class="btn primary" id="a-post">Terbitkan</button>
      <div class="msg" id="a-msg"></div>
      <div id="a-list" style="margin-top:12px"></div>
    </div>

    <h2>Log perubahan match</h2>
    <div class="card" id="log"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lmdpgbzwlrsbrylljpmp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtZHBnYnp3bHJzYnJ5bGxqcG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NDA1MjEsImV4cCI6MjEwODAxNjUyMX0.4ExJBxLwp1n76FuagX1_cBXqqsm-yy3DcJ8w5KD4XxA'; // sama dengan tool, publik

// Semua hak admin dijaga database (tabel admins + RLS). Halaman ini hanya tampilan: orang luar yang membukanya tetap tidak bisa mengubah apa pun.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce' } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const WIB = { timeZone: 'Asia/Jakarta' };
const toInput = iso => { const d = new Date(iso);
  return `${new Intl.DateTimeFormat('en-CA', WIB).format(d)}T${new Intl.DateTimeFormat('en-GB', { ...WIB, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d)}`; };
const fromInput = v => new Date(`${v}:00+07:00`).toISOString();
const fmt = iso => new Intl.DateTimeFormat('id-ID', { ...WIB, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)) + ' WIB';
const label = (m, s) => m[`team_${s}`] || (m[`src_${s}`] ? `${m[`src_${s}`][0] === 'W' ? 'Pemenang' : 'Kalah'} M${m[`src_${s}`].slice(1)}` : 'TBD');
let M = [], metrics = {};

function gate(msg, showLogin) {
  $('#app').hidden = true; $('#gate').hidden = false;
  $('#gate-msg').textContent = msg; $('#login').hidden = !showLogin;
}

async function boot(user) {
  $('#logout').hidden = !user;
  if (!user) return gate('Pakai akun Google yang terdaftar sebagai admin.', true);
  $('#who').textContent = user.email;
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) return gate(`${user.email} bukan admin. Minta owner menambahkan email ini, lalu muat ulang.`, false);
  $('#gate').hidden = true; $('#app').hidden = false;
  await Promise.all([loadMatches(), loadAnnouncements(), loadLog()]);
}

/* ---------- Metrik + match ---------- */
async function loadMatches() {
  const [m, k] = await Promise.all([sb.from('matches').select('*').order('id'), sb.rpc('admin_metrics')]);
  M = m.data || []; metrics = k.data || {};
  const pl = metrics.players || 0;
  const kpi = [
    [pl.toLocaleString('id-ID'), 'Pemain terdaftar'],
    [pl ? (metrics.predictions / pl).toFixed(1) : '0', 'Tebakan per pemain (maks 8)'],
    [pl ? Math.round(100 * metrics.returning / pl) + '%' : '0%', 'Kembali menebak di ≥ 2 hari'],
    [(metrics.today || 0).toLocaleString('id-ID'), 'Menebak hari ini'],
    [(metrics.jokers || 0).toLocaleString('id-ID'), 'Joker dipakai'],
  ];
  $('#kpi').innerHTML = kpi.map(([n, l]) => `<div class="card kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')
    + `<div class="card kpi"><div class="l">Pageview, share WA, iklan</div><div class="l" style="margin-top:4px">lihat GA4 & AdSense</div></div>`;
  $('#matches').innerHTML = M.map(card).join('');
}

function scoreOptions(m) {
  const w = (m.best_of + 1) / 2, cur = m.score_a == null ? '' : `${m.score_a}-${m.score_b}`;
  const opt = (a, b) => `<option value="${a}-${b}" ${cur === `${a}-${b}` ? 'selected' : ''}>${esc(a > b ? label(m, 'a') : label(m, 'b'))} menang ${a}–${b}</option>`;
  const os = [];
  for (let l = 0; l < w; l++) os.push(opt(w, l));
  for (let l = 0; l < w; l++) os.push(opt(l, w));
  return `<option value="" ${cur ? '' : 'selected'}>— belum ada hasil —</option>` + os.join('');
}

function card(m) {
  const tbd = !m.team_a || !m.team_b;
  const state = m.void ? '<span class="pill void">Void</span>' : m.score_a != null ? '<span class="pill done">Selesai</span>'
    : Date.now() >= new Date(m.starts_at) ? '<span class="pill">Terkunci</span>' : '<span class="pill off">Terbuka</span>';
  return `<form class="card" data-id="${m.id}">
    <div class="m-head"><span><b>M${m.id}</b> · ${esc(m.round)} · BO${m.best_of}</span>${state}</div>
    <div class="teams">${esc(label(m, 'a'))} vs ${esc(label(m, 'b'))}</div>
    <div class="m-head"><span>${(metrics.per_match || {})[m.id] || 0} tebakan</span></div>
    <label>Mulai / tebakan dikunci (WIB)</label>
    <input type="datetime-local" name="starts_at" value="${toInput(m.starts_at)}" required>
    <label class="check"><input type="checkbox" name="time_tbc" ${m.time_tbc ? 'checked' : ''}> Jam belum resmi ("Jam menyusul")</label>
    <label>Hasil akhir</label>
    <select name="score" ${tbd ? 'disabled' : ''}>${scoreOptions(m)}</select>
    <label class="check"><input type="checkbox" name="void" ${m.void ? 'checked' : ''}> Void / batal (semua tebakan 0 poin, Joker kembali)</label>
    <button class="btn primary" type="submit">Simpan M${m.id}</button>
    <div class="msg"></div>
  </form>`;
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, id = +f.dataset.id, m = M.find(x => x.id === id), msg = f.querySelector('.msg');
  if (!f.dataset.id) return;
  const [sa, sb_] = f.score.value ? f.score.value.split('-').map(Number) : [null, null];
  const patch = {}, notes = [];
  const starts = fromInput(f.starts_at.value);
  if (new Date(starts).getTime() !== new Date(m.starts_at).getTime()) {
    patch.starts_at = starts; notes.push(`Jam → ${fmt(starts)}`);
    if (new Date(starts) <= new Date()) notes.push('⚠ Jam baru sudah lewat: tebakan langsung terkunci.');
  }
  if (f.time_tbc.checked !== m.time_tbc) { patch.time_tbc = f.time_tbc.checked; notes.push(f.time_tbc.checked ? 'Tandai jam belum resmi' : 'Jam resmi'); }
  if (!f.score.disabled && (sa !== m.score_a || sb_ !== m.score_b)) {
    patch.score_a = sa; patch.score_b = sb_;
    notes.push(sa == null ? 'Hapus hasil' : `Hasil: ${label(m, 'a')} ${sa}–${sb_} ${label(m, 'b')}`);
    const flips = m.score_a != null && (sa == null || Math.sign(sa - sb_) !== Math.sign(m.score_a - m.score_b));
    if (flips) notes.push('⚠ KOREKSI PEMENANG: tim babak berikut berubah, tebakan pemain di match itu DIHAPUS.');
    if (sa != null && new Date(m.starts_at) > new Date()) notes.push('⚠ Match ini belum mulai menurut jadwal. Yakin hasilnya sudah ada?');
  }
  if (f.void.checked !== m.void) { patch.void = f.void.checked; notes.push(f.void.checked ? 'VOID: semua tebakan 0 poin' : 'Batalkan void'); }
  if (!notes.length) { msg.className = 'msg'; msg.textContent = 'Tidak ada perubahan.'; return; }
  if (!confirm(`Simpan M${id}?\n\n• ${notes.join('\n• ')}`)) return;
  const btn = f.querySelector('button'); btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Menyimpan…';
  const { data, error } = await sb.from('matches').update(patch).eq('id', id).select();
  btn.disabled = false;
  if (error || !data?.length) { msg.className = 'msg err'; msg.textContent = error ? `Gagal: ${error.message}` : 'Ditolak: akun ini bukan admin.'; return; }
  await Promise.all([loadMatches(), loadLog()]);
  const nf = document.querySelector(`form[data-id="${id}"] .msg`); nf.className = 'msg ok'; nf.textContent = '✓ Tersimpan. Klasemen diperbarui ≤ 1 menit.';
});

/* ---------- Pengumuman ---------- */
async function loadAnnouncements() {
  const { data } = await sb.from('announcements').select('*').order('created_at', { ascending: false }).limit(20);
  $('#a-list').innerHTML = (data || []).map(a => `<div class="row"><div><span class="pill ${a.active ? 'done' : 'off'}">${a.active ? 'Tayang' : 'Ditarik'}</span>
    ${esc(a.body)} ${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">link</a>` : ''}<div class="log">${fmt(a.created_at)}</div></div>
    <button class="btn ghost" data-toggle="${a.id}" data-active="${a.active}">${a.active ? 'Tarik' : 'Tayangkan'}</button></div>`).join('')
    || '<p class="log">Belum ada pengumuman. Juara harian & global tampil otomatis di tool.</p>';
}
$('#a-post').onclick = async () => {
  const body = $('#a-body').value.trim(), link = $('#a-link').value.trim() || null, msg = $('#a-msg');
  if (!body) return;
  if (link && !link.startsWith('https://')) { msg.className = 'msg err'; msg.textContent = 'Link harus diawali https://'; return; }
  const { error } = await sb.from('announcements').insert({ body, link });
  msg.className = error ? 'msg err' : 'msg ok'; msg.textContent = error ? `Gagal: ${error.message}` : '✓ Tayang di tool.';
  if (!error) { $('#a-body').value = $('#a-link').value = ''; loadAnnouncements(); }
};
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-toggle]');
  if (!t) return;
  await sb.from('announcements').update({ active: t.dataset.active !== 'true' }).eq('id', +t.dataset.toggle);
  loadAnnouncements();
});

/* ---------- Log ---------- */
async function loadLog() {
  const { data } = await sb.from('admin_log').select('*').order('id', { ascending: false }).limit(30);
  const fields = {
    Hasil: r => r.score_a == null ? '—' : `${r.score_a}–${r.score_b}`,
    Jam: r => r.starts_at ? fmt(r.starts_at) : '—',
    'Jam belum resmi': r => r.time_tbc ? 'ya' : 'tidak',
    Void: r => r.void ? 'ya' : 'tidak',
    'Tim A': r => r.team_a || '—',
    'Tim B': r => r.team_b || '—',
  };
  $('#log').innerHTML = (data || []).map(l => {
    const ch = Object.entries(fields).filter(([, f]) => f(l.before) !== f(l.after))
      .map(([k, f]) => `${k}: ${esc(f(l.before))} → <b>${esc(f(l.after))}</b>`).join(' · ');
    return `<div class="row log"><div><b>M${l.match_id}</b> · ${ch || 'tanpa perubahan kolom utama'}<br>${esc(l.actor)} · ${fmt(l.at)}</div></div>`;
  }).join('') || '<p class="log">Belum ada perubahan.</p>';
}

$('#login').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
$('#logout').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'TOKEN_REFRESHED' || ev === 'USER_UPDATED') return;
  setTimeout(() => boot(session?.user || null)); // jangan await supabase di dalam callback auth
});
</script>
</body>
</html>
