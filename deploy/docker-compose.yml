# VPS: CMS (cms.esportsku.com). Tool pemain di Vercel, database di Supabase.
# Database tetap Supabase. Jalankan dari folder ini:  docker compose up -d
# Directus 11.17.4 (BSL 1.1: gratis produksi bila total keuangan < US$5 jt/tahun). v12 tidak dipakai:
# tier gratisnya mematikan login Google staf & hak akses per kolom.
services:
  directus:
    image: directus/directus:11.17.4
    env_file: .env
    restart: unless-stopped
    expose: ["8055"]          # tidak dibuka ke internet; hanya lewat Caddy (HTTPS)
    mem_limit: 768m

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # sertifikat HTTPS (Let's Encrypt), jangan dihapus
      - caddy_config:/config
    depends_on: [directus]

volumes:
  caddy_data: {}
  caddy_config: {}
